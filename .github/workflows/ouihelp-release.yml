name: Ouihelp release

on:
  push:
    tags:
      - 'v*-ouihelp.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v1.96.4-ouihelp.1. Defaults to the current ref name.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != v*-ouihelp.* ]]; then
            echo "Release tag must look like vX.Y.Z-ouihelp.N, got: ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        shell: bash
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail

          mkdir -p dist
          release_version="${RELEASE_TAG#v}"
          pkg="tailscale-${release_version}-linux-${GOARCH}"
          archive="${pkg}.tar.gz"

          eval "$(./build_dist.sh shellvars)"
          if [[ "${VERSION_SHORT}" != "1.96.4" ]]; then
            echo "Expected VERSION_SHORT=1.96.4 for this patched build, got ${VERSION_SHORT}" >&2
            exit 1
          fi

          mkdir -p "${pkg}"
          GOOS=linux GOARCH="${GOARCH}" CGO_ENABLED=0 ./build_dist.sh -o "${pkg}/tailscale" ./cmd/tailscale
          GOOS=linux GOARCH="${GOARCH}" CGO_ENABLED=0 ./build_dist.sh -o "${pkg}/tailscaled" ./cmd/tailscaled
          chmod +x "${pkg}/tailscale" "${pkg}/tailscaled"

          cat > "${pkg}/README.txt" <<EOF
          Ouihelp patched Tailscale ${VERSION_SHORT}

          Built from GitHub release tag: ${RELEASE_TAG}
          Embedded Tailscale short version: ${VERSION_SHORT}
          Embedded Tailscale long version: ${VERSION_LONG}
          Target: linux/${GOARCH}

          Includes:
          - tailscale
          - tailscaled

          The release tag has an -ouihelp suffix, but the embedded Tailscale
          client version intentionally remains ${VERSION_SHORT} so it stays
          compatible with Tailscale infrastructure/version checks.
          EOF

          tar -czf "dist/${archive}" "${pkg}"
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-linux-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != v*-ouihelp.* ]]; then
            echo "Release tag must look like vX.Y.Z-ouihelp.N, got: ${RELEASE_TAG}" >&2
            exit 1
          fi

          (cd dist && sha256sum *.tar.gz > SHA256SUMS)

          cat > RELEASE_NOTES.md <<EOF
          Custom Ouihelp build of Tailscale v1.96.4.

          Patch: Linux firewall marks moved away from 0x80000 to avoid Cilium identity mark collisions:
          - fwmark mask: 0xf000
          - subnet-route mark: 0x1000
          - bypass mark: 0x2000

          The GitHub release tag is ${RELEASE_TAG}, but the embedded Tailscale short version remains 1.96.4 for compatibility with Tailscale infrastructure.

          Assets contain linux/amd64 and linux/arm64 `tailscale` and `tailscaled` binaries.
          EOF

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --title "${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
          fi

          gh release upload "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" dist/* --clobber
